version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: medilink
      POSTGRES_USER: medilink
      POSTGRES_PASSWORD: medilink
    ports:
      - "5432:5432"
    volumes:
      - ./microservices/lab-node-service/init.sql:/docker-entrypoint-initdb.d/init.sql

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --http-port=8180
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"

  config-server:
    build: ./microservices/config-server
    ports:
      - "8888:8888"

  eureka-server:
    build: ./microservices/eureka-server
    ports:
      - "8761:8761"
    depends_on:
      - config-server

  notification:
    build: ./microservices/notification
    ports:
      - "8050:8050"
    depends_on:
      - eureka-server

  rendez-vous:
    build: ./microservices/rendez-vous
    ports:
      - "8030:8030"
    depends_on:
      - eureka-server
      - notification

  gateway:
    build: ./microservices/gateway/getway
    ports:
      - "8560:8560"
    depends_on:
      - eureka-server
      - rendez-vous

  lab-node-service:
    build: ./microservices/lab-node-service
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: medilink
      PGPASSWORD: medilink
      PGDATABASE: medilink
      PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      - postgres
